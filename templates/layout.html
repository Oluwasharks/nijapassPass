{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NijaPass - Nigeria Travel Wallet{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top">

      <ul class="navbar-nav ms-auto align-items-center">

  </div>

<footer class="footer text-center py-4 mt-5"><p class="mb-0">© 2026 NijaPass • Built by GarnerStack Technologies LTD • RC 9858663 • Abuja, Nigeria</p><small>Green White Green - Made for Nigeria</small></footer>
